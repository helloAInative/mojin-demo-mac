name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mojinprince-server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mojinprince-server
      - run: cargo fmt --check
      - run: cargo test --locked

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle
        run: BUILD_ONLY=1 ./build.sh
      - name: Verify bundle
        run: |
          plutil -lint "build/摸金小王子.app/Contents/Info.plist"
          codesign --verify "build/摸金小王子.app"
