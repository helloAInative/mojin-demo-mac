name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mojinprince-server
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mojinprince-server
      - run: cargo fmt --check
      - run: cargo test --locked

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build app bundle
        shell: bash
        run: |
          set +e
          BUILD_ONLY=1 ./build.sh 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            python3 - <<'PY'
          from pathlib import Path

          lines = Path("build.log").read_text(errors="replace").splitlines()[-60:]
          message = "\n".join(lines).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=macOS app build failed::{message}")
          PY
          fi
          exit "$status"
      - name: Verify bundle
        run: |
          plutil -lint "build/摸金小王子.app/Contents/Info.plist"
          codesign --verify "build/摸金小王子.app"
