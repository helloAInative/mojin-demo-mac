[package]
name = "mojinprince-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web / 异步
actix-web = "4.9"
actix-web-actors = "4.3"
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
async-trait = "0.1"

# HTTP 客户端
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 时间
chrono = { version = "0.4", features = ["serde"] }

# 数据库
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros", "chrono", "migrate"] }

# 配置 / 环境
config = "0.14"
dotenvy = "0.15"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# API 文档
utoipa = { version = "5", features = ["actix_extras", "chrono"] }
utoipa-swagger-ui = { version = "8", features = ["actix-web", "vendored"] }

# 工具
thiserror = "1"
anyhow = "1"
once_cell = "1"
encoding_rs = "0.8"

[dev-dependencies]
httpmock = "0.7"
tokio = { version = "1.41", features = ["macros", "rt-multi-thread"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true